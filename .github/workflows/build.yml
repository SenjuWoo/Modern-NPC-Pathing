name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # Keep in step with BUILDING.md and build_release.ps1 (tests/test_release.py checks it).
      COMMONLIB_TAG: v14.1.0
      # Same baseline as vcpkg.json "builtin-baseline".
      VCPKG_BASELINE: 9126c6f1ff834e12372c5711ff3bdbca1921541c

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_ROOT
          if (-not $root) { $root = $env:VCPKG_INSTALLATION_ROOT }
          if (-not $root) { $root = "C:\vcpkg" }
          $toolchain = Join-Path $root "scripts/buildsystems/vcpkg.cmake"
          if (-not (Test-Path $toolchain)) {
            throw "Could not locate vcpkg toolchain at $toolchain"
          }
          "VCPKG_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # The manifest pins a baseline commit; make sure the runner's vcpkg has it.
          git -C $root fetch --quiet origin $env:VCPKG_BASELINE

      - name: Select CMake preset
        shell: pwsh
        run: |
          # windows-latest ships Visual Studio 2026; older images ship 2022. Pick by what this
          # CMake can generate rather than hardcoding one.
          $help = (& cmake --help | Out-String)
          if ($help -match "Visual Studio 18 2026") { $preset = "windows-msvc" }
          elseif ($help -match "Visual Studio 17 2022") { $preset = "windows-msvc-2022" }
          else { throw "No supported Visual Studio CMake generator found." }
          Write-Host "Using preset $preset"
          "CMAKE_PRESET=$preset" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate generated assets and run release tests
        shell: pwsh
        run: |
          python generate_esp.py
          git diff --exit-code -- package/Data/NPCPathingNG.esp package/Data/Seq/NPCPathingNG.seq
          python -m unittest discover -s tests -v

      - name: Game-independent unit tests
        shell: cmd
        run: tools\run_unit_tests.bat

      - name: Fetch pinned CommonLibSSE-NG
        shell: pwsh
        run: |
          git clone --filter=blob:none https://github.com/alandtse/CommonLibSSE-NG.git extern/CommonLibSSE
          git -C extern/CommonLibSSE checkout $env:COMMONLIB_TAG
          git -C extern/CommonLibSSE submodule update --init --depth 1

      - name: Build NPC Pathing NG and the StepUpOnto patch
        shell: pwsh
        run: |
          cmake --preset $env:CMAKE_PRESET
          cmake --build build --config RelWithDebInfo --target NPCPathingNG StepUpOntoSKSE --parallel 2

      - name: Verify the plugin actually built
        shell: pwsh
        run: |
          $dll = "package/Data/SKSE/Plugins/NPCPathingNG.dll"
          if (-not (Test-Path $dll)) { throw "build produced no DLL at $dll" }
          $version = (Select-String -Path src/version.h -Pattern 'String\s*=\s*"([0-9.]+)"').Matches[0].Groups[1].Value
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $dll))
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          if (-not $text.Contains($version)) { throw "DLL does not embed version $version" }
          Write-Host "Built NPCPathingNG.dll embedding version $version"
          "MOD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package the FOMOD
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          python tools/package_fomod.py

      # Version is read from src/version.h so this never needs editing per release.
      - name: Upload Nexus-ready release
        uses: actions/upload-artifact@v7
        with:
          name: NPC-Pathing-NG-${{ env.MOD_VERSION }}-FOMOD
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
