; NPC Pathing NG 3.0 — settings.
;
; PRECEDENCE:
;   * This file seeds the MCM when a NEW GAME starts or on a FRESH install.
;   * Loading an EXISTING save restores that save's own MCM values over the top,
;     so editing this file will not change a playthrough you already started —
;     use the in-game MCM for that. MCM changes apply instantly and persist.
;   * With no ESP / no MCM Helper, this file is the only source of settings and
;     is re-read every time you close the journal menu.
;   * Keys marked "INI only" have no MCM entry and are always read from here.

[General]
bEnabled=1
; Seconds between position samples per NPC
fCheckInterval=0.25
; Consecutive stuck samples before acting (interval * threshold = reaction time)
iStuckThreshold=4
; Moved less than this many units per sample while trying to move = stuck
fStuckDistance=4.0
; Seconds before the same NPC can be unstuck again
fCooldown=3.0
; NPCs scanned per frame (round-robin)
iActorsPerFrame=10

[Performance]
; Soft cap (milliseconds) on this mod's work per frame. Stuck-NPC detection is always
; cheap; the expensive part (ledge sweeps, leap planning) is queued and runs at most
; two per frame while the budget lasts, so a crowd of stuck NPCs cannot spike a frame.
; 0 = no cap.
fFrameBudgetMs=0.6
; INI only. NPCs farther than this many units from the player are not watched at all.
; 4500 is roughly the distance at which nothing they do is visible. 0 = watch everyone.
fProcessRadius=4500.0

[Compat]
; INI only (the MCM has the same choice as an enum).
; Auto    = detect Fluid Motion / FluidMotionNPC / NpcTraversalNG (Enemies Can Jump and
;           Vault) at game start. When one of them handles NPC jumps, vaults or climbs it
;           goes first; this mod waits twice as long, never touches an NPC they are flying,
;           keeps its own leap off, and acts only as the fallback (doors, crowd jams, SkyParkour,
;           EVG markers, last-resort teleport). Without them this mod runs the traversal itself.
; Force   = ignore the other mods and always run this mod's own traversal.
; Passive = never run the own leap; everything else only as a late fallback.
sMode=Auto

[Leap]
; Own hurdle / vault / drop for stuck humanoids, used only when no other mod owns NPC
; jumps. A collision-checked arc with the vanilla jump animations; no animation files.
bEnableLeap=1
; INI only: obstacle heights in game units (70 units ~ 1 metre). Lower is left to the navmesh.
fMinHeight=40.0
fMaxHeight=140.0
; Deepest drop taken, and only toward a goal (combat target / the player for followers) below.
fMaxDrop=300.0
; Longest horizontal hop.
fMaxDistance=260.0
; Actors in the air at once.
iMaxActive=8

[Parkour]
; Vault/climb via SkyParkour behavior patches (needs SkyParkour V3 + Nemesis/Pandora)
bEnableParkour=1
; Indoors: 0 = no parkour (default), 1 = steps and vaults only, 2 = everything
iIndoorMode=0
; Max climb height in game units. 130 (default) = steps, vaults and low/chest ledges only;
; NPCs won't scale walls, houses or mountainsides. Raise toward 250 (SkyParkour's own max)
; for full cliff/mountain climbing.
fMaxClimbHeight=130.0
; Max distance from the player at which NPCs may fire SkyParkour animations.
; SkyParkour climb/vault sounds are 2D (they play at your ears with no distance
; fade), so a far or off-screen NPC otherwise sounds like someone climbing next
; to you. 1600 is roughly a 3D footstep's hearing range. 0 = no limit.
fParkourMaxPlayerDistance=1600.0
; NPCs use EVG Animated Traversal markers as ROUTES. A stuck NPC approaching a marker
; from its entry side first tries a SkyParkour move along the marker's heading, then hops
; across to a collision-validated landing. The furniture itself is never activated for
; NPCs (the engine rejects it). Needs EVG Animated Traversal installed; harmless without
; it. Your own player-side EVG use is unaffected either way.
bEnableEVGTraversal=1

[Followers]
; Followers reproduce the player's SkyParkour and EVG traversal moves (NFF compatible)
bFollowerReplay=1

[Avoidance]
; Teleport-around-obstacle fallback, used only as a LAST resort when animated traversal
; can't help. Set 0 to disable teleporting entirely.
bEnableTeleportFallback=1
; How far sideways the bypass teleport goes
fSnapDistance=100.0
; How many times an NPC must trigger stuck (with no parkour/EVG/leap escape) before a teleport
; is allowed. Higher = teleport is rarer and more of a true last resort. Two more are
; required while Fluid Motion / NpcTraversalNG are handling NPCs.
iTeleportEscalation=5

[Filters]
; 0 = NPCs in combat ARE processed (guards/foes climb after you)
bExcludeInCombat=0
; 0 = followers ARE processed
bExcludeFollowers=0
bExcludeMounted=1

[Debug]
; Log every unstick event to NPCPathingNG.log (also logs the per-minute perf line)
bDebugLogging=0
